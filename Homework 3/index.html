<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Hub – Đăng ký sự kiện</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="hero">
    <h1 class="hero__title">🎉 Event Hub</h1>
    <p class="hero__subtitle">Đại hội Công nghệ 2026</p>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="container">

    <!-- Countdown -->
    <section class="countdown" aria-label="Đếm ngược đến sự kiện">
      <h2 class="section-title">Sự kiện bắt đầu sau</h2>
      <div class="countdown__display" id="countdown-display">
        <div class="countdown__block">
          <span class="countdown__number" id="days">--</span>
          <span class="countdown__label">Ngày</span>
        </div>
        <div class="countdown__block">
          <span class="countdown__number" id="hours">--</span>
          <span class="countdown__label">Giờ</span>
        </div>
        <div class="countdown__block">
          <span class="countdown__number" id="minutes">--</span>
          <span class="countdown__label">Phút</span>
        </div>
        <div class="countdown__block">
          <span class="countdown__number" id="seconds">--</span>
          <span class="countdown__label">Giây</span>
        </div>
      </div>
    </section>

    <!-- Registration Form -->
    <section class="registration" aria-label="Đăng ký tham gia">
      <h2 class="section-title">Đăng ký tham gia</h2>

      <form class="form" id="registration-form" novalidate>
        <div class="form__group">
          <label class="form__label" for="fullname">Họ và tên</label>
          <input
            class="form__input"
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Nguyễn Văn A"
            required
          >
        </div>

        <div class="form__group">
          <label class="form__label" for="email">Email</label>
          <input
            class="form__input"
            type="email"
            id="email"
            name="email"
            placeholder="email@example.com"
            required
          >
        </div>

        <div class="form__group">
          <label class="form__label" for="simulate-error">
            <input type="checkbox" id="simulate-error">
            Mô phỏng lỗi xử lý (dùng để kiểm tra)
          </label>
        </div>

        <button class="form__submit" type="submit">Đăng ký ngay</button>
      </form>
    </section>

    <!-- Status Display -->
    <section class="status" aria-label="Trạng thái đăng ký">
      <div class="status__box" id="status-box" data-state="idle">
        <p class="status__message" id="status-message" role="status" aria-live="polite" aria-atomic="true">
          Trạng thái: Idle — Chưa có đăng ký nào.
        </p>
      </div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>&copy; 2026 Event Hub &mdash; HW3 Landing Page</p>
  </footer>

  <script src="js/registration-form.js"></script>
</body>
</html>
